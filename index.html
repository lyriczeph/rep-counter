<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pull-Up & Push-Up Counter</title>
<meta name="theme-color" content="#01696f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reps">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; scroll-behavior: smooth; }

:root, [data-theme="light"] {
  --color-bg: #f7f6f2; --color-surface: #f9f8f5; --color-surface-2: #fbfbf9;
  --color-surface-offset: #f3f0ec; --color-surface-offset-2: #edeae5;
  --color-surface-dynamic: #e6e4df;
  --color-divider: #dcd9d5; --color-border: #d4d1ca;
  --color-text: #28251d; --color-text-muted: #7a7974; --color-text-faint: #bab9b4;
  --color-text-inverse: #f9f8f4;
  --color-primary: #01696f; --color-primary-hover: #0c4e54; --color-primary-active: #0f3638;
  --color-primary-highlight: #cedcd8;
  --color-secondary: #964219; --color-secondary-hover: #713417; --color-secondary-active: #4b2614;
  --color-secondary-highlight: #ddcfc6;
  --color-error: #a12c7b; --color-success: #437a22; --color-orange: #da7101;
  --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-full: 9999px;
  --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
  --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
  --font-body: 'Satoshi', sans-serif;
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
  --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem; --space-16: 4rem;
  --chart-primary: #01696f; --chart-primary-fill: rgba(1,105,111,0.12);
  --chart-secondary: #964219; --chart-secondary-fill: rgba(150,66,25,0.12);
  --chart-grid: #dcd9d5;
}

[data-theme="dark"] {
  --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
  --color-surface-offset: #1d1c1a; --color-surface-offset-2: #22211f;
  --color-surface-dynamic: #2d2c2a;
  --color-divider: #262523; --color-border: #393836;
  --color-text: #cdccca; --color-text-muted: #797876; --color-text-faint: #5a5957;
  --color-text-inverse: #2b2a28;
  --color-primary: #4f98a3; --color-primary-hover: #227f8b; --color-primary-active: #1a626b;
  --color-primary-highlight: #313b3b;
  --color-secondary: #bb653b; --color-secondary-hover: #b95525; --color-secondary-active: #993d10;
  --color-secondary-highlight: #564942;
  --color-error: #d163a7; --color-success: #6daa45; --color-orange: #fdab43;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
  --chart-primary: #4f98a3; --chart-primary-fill: rgba(79,152,163,0.15);
  --chart-secondary: #bb653b; --chart-secondary-fill: rgba(187,101,59,0.15);
  --chart-grid: #393836;
}

body { min-height: 100dvh; font-family: var(--font-body); font-size: var(--text-base);
  color: var(--color-text); background: var(--color-bg); line-height: 1.6; }
button { cursor: pointer; background: none; border: none; font: inherit; color: inherit;
  transition: all var(--transition-interactive); }
button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }
input:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }

.app { max-width: 480px; margin: 0 auto; padding: var(--space-4); padding-bottom: 80px; min-height: 100dvh; }

header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) 0; margin-bottom: var(--space-4); }
header h1 { font-size: var(--text-lg); font-weight: 700; display: flex; align-items: center; gap: var(--space-2); }

.header-right { display: flex; align-items: center; gap: var(--space-2); }

.user-chip { display: none; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-full); background: var(--color-surface-offset); font-size: var(--text-xs); font-weight: 500;
  max-width: 140px; overflow: hidden; }
.user-chip.visible { display: flex; }
.user-chip img { width: 24px; height: 24px; border-radius: var(--radius-full); object-fit: cover; flex-shrink: 0; }
.user-chip .user-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.theme-toggle { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--radius-full);
  background: var(--color-surface-offset); min-height: 44px; min-width: 44px; }
.theme-toggle:hover { background: var(--color-surface-offset-2); }

/* Sign-in screen */
.sign-in-screen { display: none; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100dvh; padding: var(--space-8); text-align: center; }
.sign-in-screen.visible { display: flex; }
.sign-in-screen .app-logo { margin-bottom: var(--space-6); }
.sign-in-screen .app-logo svg { width: 64px; height: 64px; color: var(--color-primary); }
.sign-in-screen h2 { font-size: var(--text-xl); font-weight: 700; margin-bottom: var(--space-2); }
.sign-in-screen .subtitle { font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: var(--space-8); max-width: 28ch; }

.google-btn { display: inline-flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-6);
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-full);
  font-size: var(--text-sm); font-weight: 600; box-shadow: var(--shadow-sm); min-height: 48px;
  transition: all var(--transition-interactive); }
.google-btn:hover { background: var(--color-surface-offset); box-shadow: var(--shadow-md); }
.google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

.skip-link { margin-top: var(--space-6); font-size: var(--text-xs); color: var(--color-text-faint);
  text-decoration: underline; text-underline-offset: 2px; }
.skip-link:hover { color: var(--color-text-muted); }

.app-shell { display: none; }
.app-shell.visible { display: block; }

/* Bottom nav */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--color-surface);
  border-top: 1px solid var(--color-divider); display: none; z-index: 50;
  padding-bottom: env(safe-area-inset-bottom, 0); }
.bottom-nav.visible { display: flex; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: var(--space-2) var(--space-1); font-size: var(--text-xs); color: var(--color-text-muted);
  min-height: 52px; justify-content: center; }
.nav-item.active { color: var(--color-primary); }
.nav-item:hover { color: var(--color-text); }
.nav-item svg { width: 22px; height: 22px; }

.panel { display: none; } .panel.active { display: block; }

/* Exercise picker */
.exercise-picker { display: flex; gap: var(--space-2); margin-bottom: var(--space-4); }
.exercise-tab { flex: 1; padding: var(--space-3); border-radius: var(--radius-lg); font-size: var(--text-sm);
  font-weight: 700; text-align: center; background: var(--color-surface); border: 2px solid transparent;
  min-height: 44px; }
.exercise-tab[data-ex="pullup"].active { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-primary-highlight); }
.exercise-tab[data-ex="pushup"].active { border-color: var(--color-secondary); color: var(--color-secondary); background: var(--color-secondary-highlight); }
.exercise-tab:not(.active):hover { background: var(--color-surface-offset); }

/* Variation selector */
.type-selector { display: flex; gap: var(--space-1); background: var(--color-surface-offset);
  border-radius: var(--radius-lg); padding: var(--space-1); margin-bottom: var(--space-6); }
.type-btn { flex: 1; padding: var(--space-2); border-radius: calc(var(--radius-lg) - var(--space-1));
  font-size: var(--text-sm); font-weight: 500; text-align: center; color: var(--color-text-muted); }
.type-btn.active { background: var(--color-surface-2); color: var(--color-text); box-shadow: var(--shadow-sm); }

/* Weight input */
.weight-input { display: none; align-items: center; justify-content: center; gap: var(--space-2);
  margin-bottom: var(--space-2); }
.weight-input.visible { display: flex; }
.weight-input label { font-size: var(--text-sm); font-weight: 500; color: var(--color-text-muted); }
.weight-input .weight-adjust { width: 40px; height: 40px; border-radius: var(--radius-full);
  background: var(--color-surface-offset); display: grid; place-items: center;
  font-size: var(--text-base); font-weight: 700; min-height: 44px; min-width: 44px; }
.weight-input .weight-adjust:hover { background: var(--color-surface-offset-2); }
.weight-input .weight-value { font-size: var(--text-lg); font-weight: 700; font-variant-numeric: tabular-nums;
  min-width: 60px; text-align: center; color: var(--color-primary); }

/* Counter */
.counter-section { display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--space-6); padding: var(--space-6) 0; }
.set-info { font-size: var(--text-sm); color: var(--color-text-muted); font-weight: 500; }
.count-display { font-size: clamp(5rem, 15vw, 8rem); font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums; user-select: none; transition: transform 120ms ease; }
.count-display.pullup { color: var(--color-primary); }
.count-display.pushup { color: var(--color-secondary); }

.counter-btn { width: clamp(130px, 36vw, 170px); height: clamp(130px, 36vw, 170px); border-radius: var(--radius-full);
  color: var(--color-text-inverse); font-size: var(--text-xl); font-weight: 700;
  box-shadow: var(--shadow-md); display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
.counter-btn.pullup { background: var(--color-primary); }
.counter-btn.pullup:hover { background: var(--color-primary-hover); transform: scale(1.03); }
.counter-btn.pullup:active { background: var(--color-primary-active); transform: scale(0.97); }
.counter-btn.pushup { background: var(--color-secondary); }
.counter-btn.pushup:hover { background: var(--color-secondary-hover); transform: scale(1.03); }
.counter-btn.pushup:active { background: var(--color-secondary-active); transform: scale(0.97); }

.counter-actions { display: flex; gap: var(--space-3); align-items: center; }
.action-btn { padding: var(--space-2) var(--space-4); border-radius: var(--radius-full); font-size: var(--text-sm);
  font-weight: 500; background: var(--color-surface-offset); min-height: 44px; }
.action-btn:hover { background: var(--color-surface-offset-2); }
.action-btn.primary { color: var(--color-text-inverse); }
.action-btn.primary.pullup { background: var(--color-primary); }
.action-btn.primary.pullup:hover { background: var(--color-primary-hover); }
.action-btn.primary.pushup { background: var(--color-secondary); }
.action-btn.primary.pushup:hover { background: var(--color-secondary-hover); }

/* Rest timer overlay */
.rest-overlay { position: fixed; inset: 0; background: oklch(from var(--color-bg) l c h / 0.92); display: none;
  place-items: center; z-index: 100; backdrop-filter: blur(8px); }
.rest-overlay.visible { display: grid; }
.rest-card { text-align: center; padding: var(--space-8); }
.rest-card h2 { font-size: var(--text-lg); color: var(--color-text-muted); margin-bottom: var(--space-4); }
.rest-timer { font-size: clamp(4rem, 12vw, 6rem); font-weight: 700; font-variant-numeric: tabular-nums; }
.rest-card .action-btn { margin-top: var(--space-6); }

/* Session */
.session-card { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-4);
  margin-bottom: var(--space-3); box-shadow: var(--shadow-sm); }
.session-card h3 { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  margin-bottom: var(--space-3); color: var(--color-text-muted); }
.session-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); text-align: center; }
.stat-value { font-size: var(--text-lg); font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-value.pullup { color: var(--color-primary); }
.stat-value.pushup { color: var(--color-secondary); }
.stat-label { font-size: var(--text-xs); color: var(--color-text-muted); }

.set-list { list-style: none; }
.set-item { display: flex; justify-content: space-between; align-items: center; padding: var(--space-3) var(--space-4);
  background: var(--color-surface); border-radius: var(--radius-md); margin-bottom: var(--space-2); font-size: var(--text-sm); }
.set-item .set-num { color: var(--color-text-muted); font-weight: 500; display: flex; align-items: center; gap: var(--space-2); }
.set-item .set-reps { font-weight: 700; font-variant-numeric: tabular-nums; }
.set-item .set-type { font-size: var(--text-xs); color: var(--color-text-faint); }
.set-item .ex-dot { width: 8px; height: 8px; border-radius: var(--radius-full); display: inline-block; flex-shrink: 0; }
.ex-dot.pullup { background: var(--color-primary); }
.ex-dot.pushup { background: var(--color-secondary); }

/* Calendar */
.cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
.cal-header h2 { font-size: var(--text-sm); font-weight: 700; }
.cal-nav-btn { width: 44px; height: 44px; border-radius: var(--radius-full); background: var(--color-surface-offset);
  display: grid; place-items: center; }
.cal-nav-btn:hover { background: var(--color-surface-offset-2); }

.cal-legend { display: flex; gap: var(--space-4); justify-content: center; margin-bottom: var(--space-4); font-size: var(--text-xs); color: var(--color-text-muted); }
.cal-legend span { display: flex; align-items: center; gap: var(--space-1); }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: var(--space-6); }
.cal-day-label { text-align: center; font-size: var(--text-xs); color: var(--color-text-faint); padding: var(--space-1) 0; font-weight: 500; }
.cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: var(--radius-md); font-size: var(--text-xs); position: relative; gap: 1px; }
.cal-cell.empty { opacity: 0; }
.cal-cell.today { outline: 2px solid var(--color-primary); outline-offset: -2px; }
.cal-cell .cal-date { font-variant-numeric: tabular-nums; color: var(--color-text-muted); }
.cal-cell .cal-dots { display: flex; gap: 2px; }
.cal-cell .cal-vol { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.6rem; }
.cal-cell .cal-counts { display: flex; gap: 2px; align-items: center; }
.cal-cell .cal-count { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.55rem; line-height: 1; }
.cal-cell .cal-count.pull { color: var(--color-primary); }
.cal-cell .cal-count.push { color: var(--color-secondary); }
.cal-cell .cal-sep { font-size: 0.5rem; color: var(--color-text-faint); }
.cal-cell.has-pullup { background: var(--color-primary-highlight); }
.cal-cell.has-both { background: linear-gradient(135deg, var(--color-primary-highlight) 50%, var(--color-secondary-highlight) 50%); }
.cal-cell.has-pushup:not(.has-pullup) { background: var(--color-secondary-highlight); }

/* Charts */
.chart-card { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-4);
  margin-bottom: var(--space-4); box-shadow: var(--shadow-sm); }
.chart-card h3 { font-size: var(--text-sm); font-weight: 700; margin-bottom: var(--space-3); }
.chart-wrap { position: relative; height: 200px; }

/* Leaderboard */
.leaderboard-card { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-4);
  margin-bottom: var(--space-4); box-shadow: var(--shadow-sm); }
.leaderboard-card h3 { font-size: var(--text-sm); font-weight: 700; margin-bottom: var(--space-3);
  display: flex; align-items: center; gap: var(--space-2); }
.leaderboard-card h3 svg { width: 18px; height: 18px; color: var(--color-orange); }
.lb-empty { text-align: center; padding: var(--space-6) var(--space-4); color: var(--color-text-muted); font-size: var(--text-sm); }

.lb-row { display: grid; grid-template-columns: 28px 36px 1fr auto; align-items: center; gap: var(--space-2);
  padding: var(--space-3) 0; border-bottom: 1px solid var(--color-divider); }
.lb-row:last-child { border-bottom: none; }
.lb-rank { font-weight: 700; font-size: var(--text-sm); color: var(--color-text-muted); text-align: center;
  font-variant-numeric: tabular-nums; }
.lb-rank.gold { color: var(--color-orange); }
.lb-avatar { width: 32px; height: 32px; border-radius: var(--radius-full); background: var(--color-surface-offset);
  display: grid; place-items: center; font-size: var(--text-xs); font-weight: 700; color: var(--color-text-muted);
  overflow: hidden; flex-shrink: 0; }
.lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
.lb-info { min-width: 0; }
.lb-name { font-size: var(--text-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-meta { font-size: var(--text-xs); color: var(--color-text-muted); display: flex; gap: var(--space-3); flex-wrap: wrap; }
.lb-stats { text-align: right; font-variant-numeric: tabular-nums; }
.lb-total { font-size: var(--text-sm); font-weight: 700; }
.lb-breakdown { font-size: var(--text-xs); color: var(--color-text-muted); }
.lb-pull { color: var(--color-primary); }
.lb-push { color: var(--color-secondary); }

/* History */
.history-filter { display: flex; gap: var(--space-1); background: var(--color-surface-offset);
  border-radius: var(--radius-lg); padding: var(--space-1); margin-bottom: var(--space-4); }
.filter-btn { flex: 1; padding: var(--space-2); border-radius: calc(var(--radius-lg) - var(--space-1));
  font-size: var(--text-sm); font-weight: 500; text-align: center; color: var(--color-text-muted); }
.filter-btn.active { background: var(--color-surface-2); color: var(--color-text); box-shadow: var(--shadow-sm); }

.history-item { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-4);
  margin-bottom: var(--space-3); box-shadow: var(--shadow-sm); }
.history-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--space-2); }
.history-date { font-size: var(--text-sm); font-weight: 700; }
.history-total { font-size: var(--text-sm); font-weight: 700; }
.history-total.pullup { color: var(--color-primary); }
.history-total.pushup { color: var(--color-secondary); }
.history-ex-label { font-size: var(--text-xs); font-weight: 600; display: inline-flex; align-items: center; gap: var(--space-1); margin-bottom: var(--space-1); }
.history-sets { font-size: var(--text-xs); color: var(--color-text-muted); }
.history-delete { font-size: var(--text-xs); color: var(--color-text-faint); margin-top: var(--space-2); }
.history-delete:hover { color: var(--color-error); }

.empty-state { text-align: center; padding: var(--space-16) var(--space-4); color: var(--color-text-muted); }
.empty-state svg { width: 48px; height: 48px; margin: 0 auto var(--space-4); color: var(--color-text-faint); }
.empty-state p { font-size: var(--text-sm); max-width: 36ch; margin: 0 auto; }

/* Settings */
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: var(--space-4);
  background: var(--color-surface); border-radius: var(--radius-md); margin-bottom: var(--space-2); }
.setting-label { font-size: var(--text-sm); font-weight: 500; }
.setting-control input { width: 60px; text-align: center; padding: var(--space-1) var(--space-2);
  border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg);
  font: inherit; font-size: var(--text-sm); font-variant-numeric: tabular-nums; color: var(--color-text); }
.section-label { font-size: var(--text-xs); font-weight: 700; color: var(--color-text-muted);
  text-transform: uppercase; letter-spacing: 0.05em; margin: var(--space-6) 0 var(--space-2); }
.section-label:first-child { margin-top: 0; }
.danger-btn { padding: var(--space-2) var(--space-4); border-radius: var(--radius-full); font-size: var(--text-sm);
  font-weight: 500; color: var(--color-error); background: var(--color-surface); }
.danger-btn:hover { background: var(--color-surface-offset); }

/* Household / Group section */
.group-card { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-4);
  margin-bottom: var(--space-3); box-shadow: var(--shadow-sm); }
.group-card h4 { font-size: var(--text-sm); font-weight: 700; margin-bottom: var(--space-2); }

.invite-code-display { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3);
  background: var(--color-surface-offset); border-radius: var(--radius-md); margin-bottom: var(--space-3);
  cursor: pointer; }
.invite-code-display:hover { background: var(--color-surface-offset-2); }

<script>
// ─── Supabase Config ───
const SUPABASE_URL = 'https://quumikcwleunjjqmendv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cH6TEM6K01gTaQp_SMwiKw_KBqCIBdO';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── Device ID (stable across sessions) ───
function getDeviceId() {
  try {
    let id = localStorage.getItem('repcounter_device_id');
    if (!id) { id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); localStorage.setItem('repcounter_device_id', id); }
    return id;
  } catch(e) { return 'default-device'; }
}
const DEVICE_ID = getDeviceId();

// ─── Auth State ───
let currentUser = null;  // null if anonymous
let currentProfile = null; // { id, display_name, avatar_url, group_id }

// ─── Toast ───
function showToast(msg, duration = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), duration);
}

// ─── Auth Functions ───
async function handleAuthChange(event, session) {
  console.log('[auth] Event:', event, session ? 'has session' : 'no session');
  if (session && session.user) {
    currentUser = session.user;
    await loadOrCreateProfile();
    await migrateDeviceWorkouts();
    showAppShell();
    updateUserChip();
    renderHouseholdSection();
    renderAccountSection();
    syncFromCloud();
  } else if (event === 'SIGNED_OUT') {
    currentUser = null;
    currentProfile = null;
    updateUserChip();
    renderHouseholdSection();
    renderAccountSection();
    showSignIn();
  }
}

async function loadOrCreateProfile() {
  if (!currentUser) return;
  try {
    const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
    if (data) {
      currentProfile = data;
      // Update profile if Google gives us newer info
      const meta = currentUser.user_metadata || {};
      const newName = meta.full_name || meta.name;
      const newAvatar = meta.avatar_url || meta.picture;
      if (newName && newName !== data.display_name || newAvatar && newAvatar !== data.avatar_url) {
        const updates = {};
        if (newName) updates.display_name = newName;
        if (newAvatar) updates.avatar_url = newAvatar;
        await sb.from('profiles').update(updates).eq('id', currentUser.id);
        Object.assign(currentProfile, updates);
      }
    } else {
      // Profile doesn't exist yet (trigger may not have fired), create it
      const meta = currentUser.user_metadata || {};
      const profile = {
        id: currentUser.id,
        display_name: meta.full_name || meta.name || currentUser.email?.split('@')[0] || 'User',
        avatar_url: meta.avatar_url || meta.picture || null,
        group_id: null
      };
      await sb.from('profiles').upsert(profile);
      currentProfile = profile;
    }
  } catch(e) {
    console.warn('[auth] Failed to load profile:', e.message);
    // Create a local fallback
    const meta = currentUser.user_metadata || {};
    currentProfile = {
      id: currentUser.id,
      display_name: meta.full_name || meta.name || 'User',
      avatar_url: meta.avatar_url || meta.picture || null,
      group_id: null
    };
  }
}

async function migrateDeviceWorkouts() {
  if (!currentUser) return;
  try {
    // Check if we already migrated (flag in localStorage)
    const migrateKey = 'repcounter_migrated_' + currentUser.id;
    if (localStorage.getItem(migrateKey)) return;

    // Find workouts with this device_id that have no user_id
    const { data: deviceWorkouts } = await sb.from('workouts')
      .select('id')
      .eq('device_id', DEVICE_ID)
      .is('user_id', null);

    if (deviceWorkouts && deviceWorkouts.length > 0) {
      // Update them to belong to this user
      const { error } = await sb.from('workouts')
        .update({ user_id: currentUser.id })
        .eq('device_id', DEVICE_ID)
        .is('user_id', null);
      if (!error) {
        console.log('[migrate] Migrated', deviceWorkouts.length, 'workouts to user');
      } else {
        console.warn('[migrate] Error migrating workouts:', error.message);
      }
    }

    // Migrate settings too
    await sb.from('settings')
      .update({ user_id: currentUser.id })
      .eq('device_id', DEVICE_ID)
      .is('user_id', null);

    localStorage.setItem(migrateKey, '1');
  } catch(e) {
    console.warn('[migrate] Migration error:', e.message);
  }
}

function showSignIn() {
  document.getElementById('signInScreen').classList.add('visible');
  document.getElementById('appShell').classList.remove('visible');
  document.getElementById('bottomNav').classList.remove('visible');
}

function showAppShell() {
  document.getElementById('signInScreen').classList.remove('visible');
  document.getElementById('appShell').classList.add('visible');
  document.getElementById('bottomNav').classList.add('visible');
}

function updateUserChip() {
  const chip = document.getElementById('userChip');
  const avatar = document.getElementById('userAvatar');
  const name = document.getElementById('userName');
  if (currentProfile && currentUser) {
    chip.classList.add('visible');
    name.textContent = (currentProfile.display_name || '').split(' ')[0]; // first name only
    if (currentProfile.avatar_url) {
      avatar.src = currentProfile.avatar_url;
      avatar.style.display = 'block';
    } else {
      avatar.style.display = 'none';
    }
  } else {
    chip.classList.remove('visible');
  }
}

// Google Sign-In
document.getElementById('googleSignIn').addEventListener('click', async () => {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname }
  });
  if (error) { showToast('Sign-in failed: ' + error.message); }
});

// Skip sign-in
document.getElementById('skipSignIn').addEventListener('click', () => {
  localStorage.setItem('repcounter_skip_signin', '1');
  showAppShell();
  syncFromCloud();
  renderHouseholdSection();
  renderAccountSection();
});

// ─── Persistence (Supabase cloud + localStorage cache) ───
function loadStateLocal() { try { const s = localStorage.getItem('repcounter_v2'); return s ? JSON.parse(s) : null; } catch(e) { return null; } }
function saveStateLocal() { try { localStorage.setItem('repcounter_v2', JSON.stringify({ history: state.history, restSeconds: state.restSeconds, targetPullups: state.targetPullups, targetPushups: state.targetPushups })); } catch(e) {} }

// Returns the identifier column/value for cloud queries
function getCloudIdentifier() {
  if (currentUser) return { column: 'user_id', value: currentUser.id };
  return { column: 'device_id', value: DEVICE_ID };
}

async function syncFromCloud() {
  try {
    const { column, value } = getCloudIdentifier();
    const [wRes, sRes] = await Promise.all([
      sb.from('workouts').select('*').eq(column, value).order('date', { ascending: false }),
      sb.from('settings').select('*').eq(column, value).single()
    ]);
    if (wRes.data && (wRes.data.length > 0 || state.history.length === 0)) {
      state.history = wRes.data.map(r => ({
        id: r.id, date: r.date,
        sets: typeof r.sets === 'string' ? JSON.parse(r.sets) : r.sets,
        pullTotal: r.pull_total, pushTotal: r.push_total
      }));
    }
    if (sRes.data) {
      state.restSeconds = sRes.data.rest_seconds || 90;
      state.targetPullups = sRes.data.target_pullups || 10;
      state.targetPushups = sRes.data.target_pushups || 20;
      document.getElementById('restTime').value = state.restSeconds;
      document.getElementById('targetPullups').value = state.targetPullups;
      document.getElementById('targetPushups').value = state.targetPushups;
    }
    saveStateLocal();
    renderHistory();
    renderCalendar();
    if (document.getElementById('panel-stats').classList.contains('active')) { updateCharts(); renderLeaderboard(); }
    console.log('[sync] Loaded from Supabase:', state.history.length, 'workouts');
  } catch(e) {
    console.warn('[sync] Cloud unavailable, using local cache:', e.message);
  }
}

async function saveWorkoutToCloud(workout) {
  try {
    const row = {
      id: workout.id, device_id: DEVICE_ID, date: workout.date,
      sets: workout.sets, pull_total: workout.pullTotal, push_total: workout.pushTotal
    };
    if (currentUser) row.user_id = currentUser.id;
    await sb.from('workouts').upsert(row);
    console.log('[sync] Workout saved to Supabase');
  } catch(e) { console.warn('[sync] Failed to save workout:', e.message); }
}

async function deleteWorkoutFromCloud(workoutId) {
  try {
    const { column, value } = getCloudIdentifier();
    await sb.from('workouts').delete().eq('id', workoutId).eq(column, value);
  } catch(e) { console.warn('[sync] Failed to delete workout:', e.message); }
}

async function saveSettingsToCloud() {
  try {
    const row = {
      device_id: DEVICE_ID, rest_seconds: state.restSeconds,
      target_pullups: state.targetPullups, target_pushups: state.targetPushups
    };
    if (currentUser) row.user_id = currentUser.id;
    await sb.from('settings').upsert(row);
  } catch(e) { console.warn('[sync] Failed to save settings:', e.message); }
}

function saveState() { saveStateLocal(); }

const defaults = { currentReps: 0, sets: [], setNumber: 1, history: [], restSeconds: 90, targetPullups: 10, targetPushups: 20, exercise: 'pullup', variant: 'standard', currentWeight: 10 };
const saved = loadStateLocal() || {};
let state = Object.assign({}, defaults, { history: saved.history || [], restSeconds: saved.restSeconds || 90, targetPullups: saved.targetPullups || 10, targetPushups: saved.targetPushups || 20 });

// sets: [{reps, exercise, variant}]
let restInterval = null;
let calMonth = new Date().getMonth(), calYear = new Date().getFullYear();
let trendChart = null, avgChart = null;
let historyFilter = 'all';

// ─── Theme ───
(function(){
  const t=document.querySelector('[data-theme-toggle]'), r=document.documentElement;
  let d=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  r.setAttribute('data-theme',d);
  t.addEventListener('click',()=>{
    d=d==='dark'?'light':'dark'; r.setAttribute('data-theme',d);
    t.innerHTML=d==='dark'
      ?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      :'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    if (document.getElementById('panel-stats').classList.contains('active')) updateCharts();
  });
})();

// ─── Navigation ───
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    item.classList.add('active');
    document.getElementById('panel-' + item.dataset.nav).classList.add('active');
    if (item.dataset.nav === 'history') renderHistory();
    if (item.dataset.nav === 'stats') { renderCalendar(); updateCharts(); renderLeaderboard(); }
    if (item.dataset.nav === 'settings') { renderHouseholdSection(); renderAccountSection(); }
  });
});

// ─── Exercise picker ───
function setExercise(ex) {
  state.exercise = ex;
  document.querySelectorAll('.exercise-tab').forEach(b => b.classList.remove('active'));
  document.querySelector(`.exercise-tab[data-ex="${ex}"]`).classList.add('active');
  document.getElementById('repCount').className = 'count-display ' + ex;
  document.getElementById('addRep').className = 'counter-btn ' + ex;
  document.getElementById('finishSet').className = 'action-btn primary ' + ex;
  const vs = document.getElementById('variantSelector');
  if (ex === 'pullup') {
    vs.innerHTML = '<button class="type-btn active" data-type="standard">Standard</button><button class="type-btn" data-type="eccentric">Eccentric</button><button class="type-btn" data-type="weighted">Weighted</button>';
  } else {
    vs.innerHTML = '<button class="type-btn active" data-type="standard">Standard</button><button class="type-btn" data-type="diamond">Diamond</button><button class="type-btn" data-type="archer">Archer</button>';
  }
  state.variant = 'standard';
  vs.querySelectorAll('.type-btn').forEach(b => b.addEventListener('click', () => {
    vs.querySelectorAll('.type-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); state.variant = b.dataset.type;
    updateWeightVisibility();
  }));
  document.querySelector('.rest-timer').style.color = ex === 'pullup' ? 'var(--color-primary)' : 'var(--color-secondary)';
  updateWeightVisibility();

document.querySelectorAll('.exercise-tab').forEach(btn => {

}
function renderWeight() {

}
document.getElementById('weightUp').addEventListener('click', () => {

document.getElementById('weightDown').addEventListener('click', () => {

// ─── Counter ───
const repDisplay = document.getElementById('repCount');
const setInfo = document.getElementById('setInfo');

document.getElementById('addRep').addEventListener('click', () => {
  state.currentReps++;
  repDisplay.textContent = state.currentReps;
  repDisplay.style.transform = 'scale(1.08)';
  setTimeout(() => repDisplay.style.transform = 'scale(1)', 120);
});

document.getElementById('undoRep').addEventListener('click', () => {
  if (state.currentReps > 0) { state.currentReps--; repDisplay.textContent = state.currentReps; }
});

document.getElementById('finishSet').addEventListener('click', () => {
  if (state.currentReps === 0) return;
  const setData = { reps: state.currentReps, exercise: state.exercise, variant: state.variant };
  if (state.variant === 'weighted') setData.weight = state.currentWeight;
  state.sets.push(setData);
  state.currentReps = 0; state.setNumber++;
  repDisplay.textContent = '0';
  setInfo.textContent = 'Set ' + state.setNumber;
  renderCurrentSets();
  if (state.restSeconds > 0) startRest();
});

function renderCurrentSets() {
  const c = document.getElementById('currentSets');
  if (state.sets.length === 0) { c.innerHTML = ''; return; }
  const pullSets = state.sets.filter(s => s.exercise === 'pullup');
  const pushSets = state.sets.filter(s => s.exercise === 'pushup');
  const pullTotal = pullSets.reduce((a, s) => a + s.reps, 0);
  const pushTotal = pushSets.reduce((a, s) => a + s.reps, 0);

  let statsHtml = '<div class="session-stats">';
  if (pullSets.length > 0) statsHtml += `<div><div class="stat-value pullup">${pullTotal}</div><div class="stat-label">Pull-ups</div></div>`;
  if (pushSets.length > 0) statsHtml += `<div><div class="stat-value pushup">${pushTotal}</div><div class="stat-label">Push-ups</div></div>`;
  statsHtml += `<div><div class="stat-value" style="color:var(--color-text)">${state.sets.length}</div><div class="stat-label">Total sets</div></div>`;
  statsHtml += '</div>';

  const variantLabel = (v) => ({ standard:'STD', eccentric:'ECC', weighted:'WTD', diamond:'DIA', archer:'ARC' }[v] || v.toUpperCase());
  const weightLabel = (s) => s.weight ? ` @ ${s.weight}lb` : '';

  c.innerHTML = `
    <div class="session-card">${statsHtml}</div>
    <ul class="set-list">${state.sets.map((s, i) =>
      `<li class="set-item"><span class="set-num"><span class="ex-dot ${s.exercise}"></span> Set ${i+1} <span class="set-type">${variantLabel(s.variant)}${weightLabel(s)}</span></span><span class="set-reps">${s.reps}</span></li>`
    ).reverse().join('')}</ul>
    <div style="padding:var(--space-3) 0;text-align:center">
      <button class="action-btn primary pullup" onclick="saveWorkout()">Save Workout</button>
    </div>`;
}

function saveWorkout() {
  if (state.sets.length === 0) return;
  const pullSets = state.sets.filter(s => s.exercise === 'pullup');
  const pushSets = state.sets.filter(s => s.exercise === 'pushup');
  const workout = {
    id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2),
    date: new Date().toISOString(),
    sets: state.sets.map(s => ({ ...s })),
    pullTotal: pullSets.reduce((a,s) => a + s.reps, 0),
    pushTotal: pushSets.reduce((a,s) => a + s.reps, 0),
  };
  state.history.unshift(workout);
  state.sets = []; state.currentReps = 0; state.setNumber = 1;
  repDisplay.textContent = '0'; setInfo.textContent = 'Set 1';
  renderCurrentSets(); saveState();
  saveWorkoutToCloud(workout);
}

// ─── Rest Timer ───
function startRest() {
  let remaining = state.restSeconds;
  const overlay = document.getElementById('restOverlay');
  const display = document.getElementById('restDisplay');
  overlay.classList.add('visible');
  updateRestDisplay(remaining, display);
  restInterval = setInterval(() => { remaining--; updateRestDisplay(remaining, display); if (remaining <= 0) endRest(); }, 1000);
}
function updateRestDisplay(s, el) { el.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function endRest() { clearInterval(restInterval); document.getElementById('restOverlay').classList.remove('visible'); }
document.getElementById('skipRest').addEventListener('click', endRest);

// ─── Local Date Helpers ───
function toLocalDateKey(d) {
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function getDateKey(d) { return toLocalDateKey(d); }

// ─── Calendar ───
function getDailyVolume() {
  const vol = {};
  state.history.forEach(w => {
    const key = toLocalDateKey(w.date);
    if (!vol[key]) vol[key] = { pull: 0, push: 0 };
    vol[key].pull += w.pullTotal || 0;
    vol[key].push += w.pushTotal || 0;
  });
  return vol;
}

function renderCalendar() {
  const vol = getDailyVolume();
  document.getElementById('calTitle').textContent = ['January','February','March','April','May','June','July','August','September','October','November','December'][calMonth] + ' ' + calYear;
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const todayKey = getDateKey(new Date());
  let html = ['Su','Mo','Tu','We','Th','Fr','Sa'].map(d => `<div class="cal-day-label">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const v = vol[key] || { pull: 0, push: 0 };
    const hasPull = v.pull > 0, hasPush = v.push > 0;
    const cls = ['cal-cell', hasPull ? 'has-pullup' : '', hasPush ? 'has-pushup' : '', (hasPull && hasPush) ? 'has-both' : '', key === todayKey ? 'today' : ''].filter(Boolean).join(' ');
    let countHtml = '';
    if (v.pull > 0 && v.push > 0) {
      countHtml = `<span class="cal-counts"><span class="cal-count pull">${v.pull}</span><span class="cal-sep">/</span><span class="cal-count push">${v.push}</span></span>`;
    } else if (v.pull > 0) {
      countHtml = `<span class="cal-count pull">${v.pull}</span>`;
    } else if (v.push > 0) {
      countHtml = `<span class="cal-count push">${v.push}</span>`;
    }
    html += `<div class="${cls}"><span class="cal-date">${d}</span>${countHtml}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

document.getElementById('calPrev').addEventListener('click', () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); });
document.getElementById('calNext').addEventListener('click', () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); });

// ─── Charts ───
function getCS(prop) { return getComputedStyle(document.documentElement).getPropertyValue(prop).trim(); }

function updateCharts() {
  const vol = getDailyVolume();
  const labels = [], pullData = [], pushData = [], pullAvg = [], pushAvg = [];
  const now = new Date();
  for (let i = 29; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    const key = getDateKey(d);
    labels.push(d.getDate() + '/' + (d.getMonth()+1));
    const v = vol[key] || { pull: 0, push: 0 };
    pullData.push(v.pull > 0 ? v.pull : null); pushData.push(v.push > 0 ? v.push : null);
    const dayW = state.history.filter(w => toLocalDateKey(w.date) === key);
    let pSets = 0, pReps = 0, uSets = 0, uReps = 0;
    dayW.forEach(w => w.sets.forEach(s => { if (s.exercise==='pullup'){pSets++;pReps+=s.reps;} else {uSets++;uReps+=s.reps;} }));
    pullAvg.push(pSets > 0 ? Math.round(pReps/pSets*10)/10 : null);
    pushAvg.push(uSets > 0 ? Math.round(uReps/uSets*10)/10 : null);
  }
  const grid = getCS('--chart-grid') || '#dcd9d5';
  const textC = getCS('--color-text-muted') || '#7a7974';

  const lineBaseOpts = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: true, labels: { boxWidth: 10, padding: 12, font: { size: 11, family: 'Satoshi' }, color: textC } } },
    scales: {
      x: { grid: { display: false }, ticks: { color: textC, font: { size: 10, family: 'Satoshi' }, maxRotation: 0, maxTicksLimit: 7 } },
      y: { grid: { color: grid }, ticks: { color: textC, font: { size: 10, family: 'Satoshi' }, precision: 0 }, beginAtZero: true }
    }
  };

  if (trendChart) trendChart.destroy();
  trendChart = new Chart(document.getElementById('trendChart'), {
    type: 'line', data: { labels, datasets: [
      { label: 'Pull-Ups', data: pullData, borderColor: getCS('--chart-primary'), backgroundColor: getCS('--chart-primary-fill'), tension: 0.3, fill: true, pointRadius: 2, pointBackgroundColor: getCS('--chart-primary'), spanGaps: false },
      { label: 'Push-Ups', data: pushData, borderColor: getCS('--chart-secondary'), backgroundColor: getCS('--chart-secondary-fill'), tension: 0.3, fill: true, pointRadius: 2, pointBackgroundColor: getCS('--chart-secondary'), spanGaps: false },
    ] }, options: lineBaseOpts
  });

  const avgOpts = { ...lineBaseOpts };
  if (avgChart) avgChart.destroy();
  avgChart = new Chart(document.getElementById('avgChart'), {
    type: 'line', data: { labels, datasets: [
      { label: 'Pull-Ups', data: pullAvg, borderColor: getCS('--chart-primary'), backgroundColor: getCS('--chart-primary-fill'), tension: 0.3, fill: true, pointRadius: 2, spanGaps: true },
      { label: 'Push-Ups', data: pushAvg, borderColor: getCS('--chart-secondary'), backgroundColor: getCS('--chart-secondary-fill'), tension: 0.3, fill: true, pointRadius: 2, spanGaps: true },
    ] }, options: avgOpts
  });
}

// ─── Leaderboard ───
async function renderLeaderboard() {
  const section = document.getElementById('leaderboardSection');
  if (!currentUser || !currentProfile || !currentProfile.group_id) {
    if (!currentUser) {
      section.innerHTML = `
        <div class="leaderboard-card">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9H4.5a2.5 2.5 0 010-5C7 4 7 7 7 7M18 9h1.5a2.5 2.5 0 000-5C17 4 17 7 17 7M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 19.24 7 20v2M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 19.24 17 20v2M12 2v5"/><circle cx="12" cy="9" r="4"/></svg> Leaderboard</h3>
          <div class="signin-nudge">
            <p>Sign in and join a household to see the leaderboard.</p>
          </div>
        </div>`;
    } else {
      section.innerHTML = `
        <div class="leaderboard-card">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9H4.5a2.5 2.5 0 010-5C7 4 7 7 7 7M18 9h1.5a2.5 2.5 0 000-5C17 4 17 7 17 7M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 19.24 7 20v2M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 19.24 17 20v2M12 2v5"/><circle cx="12" cy="9" r="4"/></svg> Leaderboard</h3>
          <div class="lb-empty">Join a household in Settings to see the leaderboard.</div>
        </div>`;
    }
    return;
  }

  section.innerHTML = `
    <div class="leaderboard-card">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9H4.5a2.5 2.5 0 010-5C7 4 7 7 7 7M18 9h1.5a2.5 2.5 0 000-5C17 4 17 7 17 7M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 19.24 7 20v2M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 19.24 17 20v2M12 2v5"/><circle cx="12" cy="9" r="4"/></svg> Leaderboard</h3>
      <div class="lb-empty" style="padding:var(--space-4)">Loading...</div>
    </div>`;

  try {
    // Get group members
    const { data: members } = await sb.from('profiles')
      .select('id, display_name, avatar_url')
      .eq('group_id', currentProfile.group_id);

    if (!members || members.length === 0) {
      section.querySelector('.lb-empty').textContent = 'No members in your group yet.';
      return;
    }

    const memberIds = members.map(m => m.id);

    // Get this week's boundaries (Monday to Sunday)
    const now = new Date();
    const dayOfWeek = now.getDay(); // 0=Sun, 1=Mon, ...
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    const monday = new Date(now);
    monday.setDate(now.getDate() + mondayOffset);
    monday.setHours(0, 0, 0, 0);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    sunday.setHours(23, 59, 59, 999);

    // Get all workouts for group members
    const { data: workouts } = await sb.from('workouts')
      .select('user_id, date, sets, pull_total, push_total')
      .in('user_id', memberIds);

    // Calculate stats per member
    const stats = members.map(member => {
      const mWorkouts = (workouts || []).filter(w => w.user_id === member.id);

      // This week's totals
      const weekWorkouts = mWorkouts.filter(w => {
        const d = new Date(w.date);
        return d >= monday && d <= sunday;
      });
      const weekPull = weekWorkouts.reduce((a, w) => a + (w.pull_total || 0), 0);
      const weekPush = weekWorkouts.reduce((a, w) => a + (w.push_total || 0), 0);
      const weekTotal = weekPull + weekPush;

      // Current streak (consecutive days with at least 1 workout, going back from today)
      let streak = 0;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const workoutDates = new Set(mWorkouts.map(w => toLocalDateKey(w.date)));
      const checkDate = new Date(today);
      // If no workout today, check if yesterday has one. If neither, streak is 0.
      if (!workoutDates.has(toLocalDateKey(checkDate))) {
        checkDate.setDate(checkDate.getDate() - 1);
        if (!workoutDates.has(toLocalDateKey(checkDate))) {
          streak = 0;
        } else {
          // Start counting from yesterday
          while (workoutDates.has(toLocalDateKey(checkDate))) {
            streak++;
            checkDate.setDate(checkDate.getDate() - 1);
          }
        }
      } else {
        while (workoutDates.has(toLocalDateKey(checkDate))) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        }
      }

      // Best single set PRs
      let prPull = 0, prPush = 0;
      mWorkouts.forEach(w => {
        const sets = typeof w.sets === 'string' ? JSON.parse(w.sets) : (w.sets || []);
        sets.forEach(s => {
          if (s.exercise === 'pullup' && s.reps > prPull) prPull = s.reps;
          if (s.exercise === 'pushup' && s.reps > prPush) prPush = s.reps;
        });
      });

      return {
        ...member,
        weekTotal, weekPull, weekPush,
        streak,
        prPull, prPush
      };
    });

    // Sort by weekly total descending
    stats.sort((a, b) => b.weekTotal - a.weekTotal);

    // Render
    let html = `<div class="leaderboard-card">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9H4.5a2.5 2.5 0 010-5C7 4 7 7 7 7M18 9h1.5a2.5 2.5 0 000-5C17 4 17 7 17 7M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 19.24 7 20v2M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 19.24 17 20v2M12 2v5"/><circle cx="12" cy="9" r="4"/></svg> This Week's Leaderboard</h3>`;

    stats.forEach((m, i) => {
      const rank = i + 1;
      const initial = (m.display_name || '?').charAt(0).toUpperCase();
      const avatarHtml = m.avatar_url
        ? `<img src="${m.avatar_url}" alt="${m.display_name}">`
        : initial;
      html += `
        <div class="lb-row">
          <div class="lb-rank ${rank === 1 ? 'gold' : ''}">${rank}</div>
          <div class="lb-avatar">${avatarHtml}</div>
          <div class="lb-info">
            <div class="lb-name">${m.display_name || 'User'}</div>
            <div class="lb-meta">
              <span>${m.streak}d streak</span>
              <span>PR: <span class="lb-pull">${m.prPull}</span> / <span class="lb-push">${m.prPush}</span></span>
            </div>
          </div>
          <div class="lb-stats">
            <div class="lb-total">${m.weekTotal}</div>
            <div class="lb-breakdown"><span class="lb-pull">${m.weekPull}</span> + <span class="lb-push">${m.weekPush}</span></div>
          </div>
        </div>`;
    });

    html += '</div>';
    section.innerHTML = html;
  } catch(e) {
    console.warn('[leaderboard] Error:', e.message);
    section.querySelector('.lb-empty').textContent = 'Unable to load leaderboard.';
  }
}

// ─── Household / Group ───
function generateInviteCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no I/O/0/1 for readability
  let code = '';
  for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  return code;
}

async function createGroup() {
  if (!currentUser) return;
  const name = prompt('Group name (e.g. "The Maynes Family"):');
  if (!name || !name.trim()) return;

  try {
    const inviteCode = generateInviteCode();
    const { data, error } = await sb.from('groups').insert({
      name: name.trim(),
      invite_code: inviteCode,
      created_by: currentUser.id
    }).select().single();

    if (error) throw error;

    // Update profile with group_id
    await sb.from('profiles').update({ group_id: data.id }).eq('id', currentUser.id);
    currentProfile.group_id = data.id;
    showToast('Group created!');
    renderHouseholdSection();
    renderLeaderboard();
  } catch(e) {
    showToast('Error: ' + e.message);
  }
}

async function joinGroup() {
  if (!currentUser) return;
  const input = document.getElementById('joinCodeInput');
  const code = (input.value || '').trim().toUpperCase();
  if (code.length !== 6) { showToast('Enter a 6-character code'); return; }

  try {
    const { data: group, error } = await sb.from('groups')
      .select('id, name')
      .eq('invite_code', code)
      .single();

    if (error || !group) { showToast('Invalid invite code'); return; }

    await sb.from('profiles').update({ group_id: group.id }).eq('id', currentUser.id);
    currentProfile.group_id = group.id;
    showToast('Joined ' + group.name + '!');
    input.value = '';
    renderHouseholdSection();
    renderLeaderboard();
  } catch(e) {
    showToast('Error: ' + e.message);
  }
}

async function leaveGroup() {
  if (!currentUser || !currentProfile?.group_id) return;
  if (!confirm('Leave this group?')) return;
  try {
    await sb.from('profiles').update({ group_id: null }).eq('id', currentUser.id);
    currentProfile.group_id = null;
    showToast('Left group');
    renderHouseholdSection();
    renderLeaderboard();
  } catch(e) { showToast('Error: ' + e.message); }
}

      .eq('group_id', currentProfile.group_id);

    const groupName = group?.name || 'Your Group';
    const inviteCode = group?.invite_code || '------';

    let membersHtml = (members || []).map(m => {
      const initial = (m.display_name || '?').charAt(0).toUpperCase();
      const avatarHtml = m.avatar_url
        ? `<img src="${m.avatar_url}" alt="">`
        : initial;
      const youLabel = m.id === currentUser.id ? ' <span style="color:var(--color-text-faint)">(you)</span>' : '';
      return `<div class="group-member">
        <div class="group-member-avatar">${avatarHtml}</div>
        <span class="group-member-name">${m.display_name || 'User'}${youLabel}</span>
      </div>`;
    }).join('');

    section.innerHTML = `
      <div class="section-label">Household</div>
      <div class="group-card">
        <h4>${groupName}</h4>
        <p style="font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:var(--space-2)">Invite code (tap to copy):</p>
        <div class="invite-code-display" onclick="copyInviteCode('${inviteCode}')">
          <span class="code">${inviteCode}</span>
          <span class="copy-hint">Copy</span>
        </div>
        <p style="font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:var(--space-2)">Members (${(members || []).length}):</p>
        ${membersHtml}
        <div style="margin-top:var(--space-4);text-align:center">
          <button class="danger-btn" onclick="leaveGroup()">Leave Group</button>
        </div>
      </div>`;
  } catch(e) {
    section.innerHTML = `
      <div class="section-label">Household</div>
      <div class="group-card"><p style="font-size:var(--text-sm);color:var(--color-text-muted)">Unable to load group info.</p></div>`;
  }
}

function copyInviteCode(code) {
  navigator.clipboard.writeText(code).then(() => showToast('Invite code copied!')).catch(() => {
    // Fallback
    const el = document.createElement('textarea');
    el.value = code; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
    showToast('Invite code copied!');
  });
}

// ─── Account Section in Settings ───
function renderAccountSection() {
  const section = document.getElementById('accountSection');
  if (!currentUser) {
    section.innerHTML = `
      <div class="section-label">Account</div>
      <div class="setting-row">
        <span class="setting-label">Not signed in</span>
        <button class="primary-btn" style="font-size:var(--text-xs);min-height:36px;padding:var(--space-1) var(--space-3)" onclick="signInFromSettings()">Sign In</button>
      </div>`;
    return;
  }

  section.innerHTML = `
    <div class="section-label">Account</div>
    <div class="setting-row">
      <span class="setting-label">${currentProfile?.display_name || currentUser.email}</span>
      <button class="danger-btn" onclick="signOut()">Sign Out</button>
    </div>`;
}

async function signInFromSettings() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname }
  });
  if (error) showToast('Sign-in failed');
}

async function signOut() {
  await sb.auth.signOut();
  currentUser = null;
  currentProfile = null;
  localStorage.removeItem('repcounter_skip_signin');
  updateUserChip();
  showSignIn();
}

// ─── History ───
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); historyFilter = btn.dataset.filter; renderHistory();
  });
});

function renderHistory() {
  const c = document.getElementById('historyList');
  let filtered = state.history;
  if (historyFilter === 'pullup') filtered = filtered.filter(w => w.pullTotal > 0);
  if (historyFilter === 'pushup') filtered = filtered.filter(w => w.pushTotal > 0);
  if (filtered.length === 0) {
    c.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><p>No workouts yet. Finish a workout to see your history here.</p></div>`;
    return;
  }
  const vLabel = (v) => ({ standard:'', eccentric:' ecc', weighted:' wtd', diamond:' dia', archer:' arc' }[v] || '');
  const wLabel = (s) => s.weight ? ` @${s.weight}lb` : '';
  c.innerHTML = filtered.map((w, idx) => {
    const realIdx = state.history.indexOf(w);
    const d = new Date(w.date);
    const dateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    let body = '';
    if (w.pullTotal > 0) {
      const ps = w.sets.filter(s => s.exercise === 'pullup');
      body += `<div class="history-ex-label"><span class="ex-dot pullup"></span> Pull-Ups — <span class="history-total pullup">${w.pullTotal} reps</span></div>
        <div class="history-sets">${ps.map((s,j) => `Set ${j+1}: ${s.reps}${vLabel(s.variant)}${wLabel(s)}`).join(' · ')}</div>`;
    }
    if (w.pushTotal > 0) {
      const us = w.sets.filter(s => s.exercise === 'pushup');
      body += `<div class="history-ex-label" style="margin-top:var(--space-2)"><span class="ex-dot pushup"></span> Push-Ups — <span class="history-total pushup">${w.pushTotal} reps</span></div>
        <div class="history-sets">${us.map((s,j) => `Set ${j+1}: ${s.reps}${vLabel(s.variant)}${wLabel(s)}`).join(' · ')}</div>`;
    }
    return `<div class="history-item"><div class="history-header"><span class="history-date">${dateStr}</span></div>${body}<button class="history-delete" onclick="deleteWorkout(${realIdx})">Delete</button></div>`;
  }).join('');
}

function deleteWorkout(i) {
  const workout = state.history[i];
  const workoutId = workout && workout.id;
  state.history.splice(i, 1); saveState(); renderHistory();
  if (workoutId) deleteWorkoutFromCloud(workoutId);
}

// ─── Settings ───
document.getElementById('restTime').value = state.restSeconds;
document.getElementById('targetPullups').value = state.targetPullups;
document.getElementById('targetPushups').value = state.targetPushups;
document.getElementById('restTime').addEventListener('change', e => { state.restSeconds = parseInt(e.target.value)||90; saveState(); saveSettingsToCloud(); });
document.getElementById('targetPullups').addEventListener('change', e => { state.targetPullups = parseInt(e.target.value)||10; saveState(); saveSettingsToCloud(); });
document.getElementById('targetPushups').addEventListener('change', e => { state.targetPushups = parseInt(e.target.value)||20; saveState(); saveSettingsToCloud(); });
document.getElementById('clearHistory').addEventListener('click', () => { if (confirm('Clear all workout history?')) { state.history = []; saveState(); renderHistory(); } });
document.getElementById('exportData').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state.history, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'rep-counter-data.json'; a.click();
});

renderCalendar();

// ─── Auth Init ───
(async function initAuth() {
  // Listen for auth state changes
  sb.auth.onAuthStateChange((event, session) => {
    handleAuthChange(event, session);
  });

  // Check current session
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) {
    // Already logged in
    currentUser = session.user;
    await loadOrCreateProfile();
    await migrateDeviceWorkouts();
    showAppShell();
    updateUserChip();
    renderHouseholdSection();
    renderAccountSection();
    syncFromCloud();
  } else if (localStorage.getItem('repcounter_skip_signin')) {
    // User previously chose to skip sign-in
    showAppShell();
    renderHouseholdSection();
    renderAccountSection();
    syncFromCloud();
  } else {
    // Show sign-in screen
    showSignIn();
  }
})();
</script>
</body>
</html>
